version: "3.9"

services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-ecotrace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecotrace}
      POSTGRES_DB:       ${POSTGRES_DB:-ecotrace}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecotrace}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ecotrace}:${POSTGRES_PASSWORD:-ecotrace}@db:5432/${POSTGRES_DB:-ecotrace}
      SECRET_KEY:   ${SECRET_KEY:-change-me-in-production}
      ENVIRONMENT:  ${ENVIRONMENT:-development}
    ports:
      - "8000:8000"
    volumes:
      # Mount seed/data so generated CSVs persist outside the container
      - ./seed/data:/app/seed/data

volumes:
  pg_data:
